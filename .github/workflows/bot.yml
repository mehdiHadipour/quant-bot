name: Quant Bot - Safe Trading Cycle

on:
  schedule:
    # GitHub Actions schedules are best-effort and do NOT guarantee
    # execution exactly every 10 minutes.
    #
    # This schedule intentionally runs every 10 minutes with an offset
    # from minute 00 to reduce top-of-the-hour contention.
    - cron: "4-59/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false

jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static validation
        run: python scripts/validate_project.py

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check .

      - name: Generate ephemeral test encryption key
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          TELEGRAM_TOKEN: test-token
          TELEGRAM_CHAT: test-chat
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

          SYMBOLS: ${{ vars.SYMBOLS }}
          MIN_SIGNAL_PROBABILITY: ${{ vars.MIN_SIGNAL_PROBABILITY }}
          MIN_ADX: ${{ vars.MIN_ADX }}
          ATR_SL_MULTIPLIER: ${{ vars.ATR_SL_MULTIPLIER }}
          ATR_TP_MULTIPLIER: ${{ vars.ATR_TP_MULTIPLIER }}
          RISK_PERCENT_PER_TRADE: ${{ vars.RISK_PERCENT_PER_TRADE }}
          SL_WARNING_THRESHOLD: ${{ vars.SL_WARNING_THRESHOLD }}
          SYMBOL_COOLDOWN_CYCLES: ${{ vars.SYMBOL_COOLDOWN_CYCLES }}
          CYCLE_MINUTES: ${{ vars.CYCLE_MINUTES }}
          SILENCE_GAP_MULTIPLIER: ${{ vars.SILENCE_GAP_MULTIPLIER }}

          TRAILING_TRIGGER_R: ${{ vars.TRAILING_TRIGGER_R }}
          PARTIAL_LOCK_TRIGGER_R: ${{ vars.PARTIAL_LOCK_TRIGGER_R }}
          PARTIAL_LOCK_R: ${{ vars.PARTIAL_LOCK_R }}

          MAX_CONCURRENT_TRADES: ${{ vars.MAX_CONCURRENT_TRADES }}
          MAX_DAILY_LOSS_R: ${{ vars.MAX_DAILY_LOSS_R }}
          MAX_OPEN_RISK_R: ${{ vars.MAX_OPEN_RISK_R }}
          MIN_REWARD_RISK: ${{ vars.MIN_REWARD_RISK }}
          MAX_SAME_DIRECTION_OPEN: ${{ vars.MAX_SAME_DIRECTION_OPEN }}

        run: python main.py

      - name: Persist state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Persist encrypted state and encrypted trade history.
          for f in \
            state/state.json.enc \
            state/state.json.enc.bak \
            data/history.csv.enc
          do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          # Remove legacy plaintext history.csv from Git tracking
          # if the migration has already deleted it locally.
          if [ ! -f "data/history.csv" ]; then
            git rm --cached --ignore-unmatch -q data/history.csv || true
          fi

          # Commit and push only when there are actual changes.
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist bot state [skip ci]"
            git push
          else
            echo "No state or history changes to persist."
          fi
