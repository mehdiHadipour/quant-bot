name: Quant Bot - Safe Trading Cycle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Test Telegram Connection
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python -c "
import os, requests, sys
token = os.getenv('TELEGRAM_TOKEN')
chat = os.getenv('TELEGRAM_CHAT')
print('Token:', token[:10] + '...' if token else 'NOT SET')
print('Chat ID:', chat if chat else 'NOT SET')
if not token or not chat:
    print('❌ Secrets NOT SET!')
    sys.exit(1)
try:
    r = requests.post(f'https://api.telegram.org/bot{token}/sendMessage', 
                      data={'chat_id': chat, 'text': '✅ Test message from bot!'}, timeout=10)
    print('Status:', r.status_code)
    print('Response:', r.text)
    sys.exit(0 if r.status_code == 200 else 1)
except Exception as e:
    print('❌ Error:', e)
    sys.exit(1)
"
      
      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python main.py
      
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/state.json.enc || true
          git diff --cached --quiet || (git commit -m "chore: persist bot state [skip ci]" && git push)
