name: AI Quant Bot - Trading Cycle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false

jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure state/data directories exist
        run: mkdir -p state data

      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python main.py

      - name: Save state & history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json.enc data/history.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update bot state & history [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
