name: Quant Bot - Smart Context Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/10 * * * *'
permissions:
  contents: write
concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false
jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          BUY_ONLY_SYMBOLS: ${{ vars.BUY_ONLY_SYMBOLS }}
          SELL_ONLY_SYMBOLS: ${{ vars.SELL_ONLY_SYMBOLS }}
          WHALE_BIAS_JSON: ${{ vars.WHALE_BIAS_JSON }}
          FUNDAMENTAL_JSON: ${{ vars.FUNDAMENTAL_JSON }}
          TRADFI_ENABLED: ${{ vars.TRADFI_ENABLED }}
          TRADFI_LIVE_APPROVAL_REQUIRED: ${{ vars.TRADFI_LIVE_APPROVAL_REQUIRED }}
          TRADFI_APPROVED_SYMBOLS: ${{ vars.TRADFI_APPROVED_SYMBOLS }}
          TRADFI_APPROVAL_FILE: ${{ vars.TRADFI_APPROVAL_FILE }}
          TRADFI_BACKTEST_DAYS: ${{ vars.TRADFI_BACKTEST_DAYS }}
        run: python main.py
      - name: Persist encrypted runtime state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove atomic-write temp files (never commit these)
          rm -f state/*.tmp data/*.tmp 2>/dev/null || true

          # Stage only the encrypted runtime artifacts we care about
          shopt -s nullglob
          files=(state/*.enc state/*.bak state/*.json data/history.csv.enc)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No state files present to persist."
            exit 0
          fi
          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No encrypted state changes to commit."
            exit 0
          fi

          git commit -m "Persist Quant Bot encrypted runtime state"

          # --autostash automatically stashes any remaining dirty files,
          # does the rebase, then restores them (fixes the exact error you saw)
          git pull --rebase --autostash origin main
          git push
