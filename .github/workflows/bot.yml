name: Quant Bot - Smart Context Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false
jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate project
        run: python scripts/validate_project.py
      - name: System audit
        run: python scripts/system_audit.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          BUY_ONLY_SYMBOLS: ${{ vars.BUY_ONLY_SYMBOLS }}
          SELL_ONLY_SYMBOLS: ${{ vars.SELL_ONLY_SYMBOLS }}
          WHALE_BIAS_JSON: ${{ vars.WHALE_BIAS_JSON }}
          WHALE_BIAS_FILE: whale_bias.json
          FUNDAMENTAL_JSON: ${{ vars.FUNDAMENTAL_JSON }}
          SMART_CONTEXT_MODE: live
          SMART_CONTEXT_ENABLED: 1
          SESSION_VETO_ENABLED: 0
          MIN_SESSION_QUALITY: 0
          ENABLE_DIRECTION_POLICY: 0
        run: python main.py
      - name: Persist state (open trades, stats, history) back to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state/ data/ 2>/dev/null)" ]; then
            git config user.name "quant-bot"
            git config user.email "actions@github.com"
            git add state/ data/
            git commit -m "chore: persist bot state after cycle [skip ci]"
            git push
          else
            echo "No state/data changes to persist this cycle."
          fi
