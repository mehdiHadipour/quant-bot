- name: Persist encrypted runtime state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove atomic-write temp files (never commit these)
          rm -f state/*.tmp data/*.tmp 2>/dev/null || true

          # Collect only files that actually exist
          shopt -s nullglob
          files=()
          for f in state/*.enc state/*.bak state/*.json data/history.csv.enc; do
            [ -f "$f" ] && files+=("$f")
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "No state files present to persist."
            exit 0
          fi

          echo "Staging: ${files[*]}"
          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No encrypted state changes to commit."
            exit 0
          fi

          git commit -m "Persist Quant Bot encrypted runtime state"

          # --autostash handles any remaining dirty files automatically
          git pull --rebase --autostash origin main
          git push
