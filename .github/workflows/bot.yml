name: Quant Bot - Safe Trading Cycle

on:
  schedule:
    # GitHub Actions is only the wake-up mechanism.
    # The Python engine itself decides whether 10 minutes have elapsed
    # since the last successfully completed cycle.
    #
    # This decouples real cycle timing from wall-clock cron minutes.
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false

jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static validation
        run: python scripts/validate_project.py

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check .

      - name: Generate ephemeral test encryption key
        run: echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          TELEGRAM_TOKEN: test-token
          TELEGRAM_CHAT: test-chat
        run: python -m unittest discover -s tests -t . -v

      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          MIN_SIGNAL_PROBABILITY: ${{ vars.MIN_SIGNAL_PROBABILITY }}
          MIN_ADX: ${{ vars.MIN_ADX }}
          ATR_SL_MULTIPLIER: ${{ vars.ATR_SL_MULTIPLIER }}
          ATR_TP_MULTIPLIER: ${{ vars.ATR_TP_MULTIPLIER }}
          RISK_PERCENT_PER_TRADE: ${{ vars.RISK_PERCENT_PER_TRADE }}
          SL_WARNING_THRESHOLD: ${{ vars.SL_WARNING_THRESHOLD }}
          SYMBOL_COOLDOWN_CYCLES: ${{ vars.SYMBOL_COOLDOWN_CYCLES }}
          CYCLE_MINUTES: ${{ vars.CYCLE_MINUTES }}
          SILENCE_GAP_MULTIPLIER: ${{ vars.SILENCE_GAP_MULTIPLIER }}
          TRAILING_TRIGGER_R: ${{ vars.TRAILING_TRIGGER_R }}
          PARTIAL_LOCK_TRIGGER_R: ${{ vars.PARTIAL_LOCK_TRIGGER_R }}
          PARTIAL_LOCK_R: ${{ vars.PARTIAL_LOCK_R }}
          MAX_CONCURRENT_TRADES: ${{ vars.MAX_CONCURRENT_TRADES }}
          MAX_DAILY_LOSS_R: ${{ vars.MAX_DAILY_LOSS_R }}
          MAX_OPEN_RISK_R: ${{ vars.MAX_OPEN_RISK_R }}
          MIN_REWARD_RISK: ${{ vars.MIN_REWARD_RISK }}
          MAX_SAME_DIRECTION_OPEN: ${{ vars.MAX_SAME_DIRECTION_OPEN }}
        run: python main.py

      - name: Persist state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in state/state.json.enc state/state.json.enc.bak data/history.csv.enc; do
            [ -f "$f" ] && git add -f "$f"
          done

          if [ ! -f "data/history.csv" ]; then
            git rm --cached --ignore-unmatch -q data/history.csv || true
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: persist bot state [skip ci]"
            git push
          fi
