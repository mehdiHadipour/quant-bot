name: AI Quant Bot v23.0 - Trading Cycle

on:
  schedule:
    # Every 5 minutes (changed from 15, per request, to reduce entry
    # delay). IMPORTANT COST NOTE: GitHub gives PRIVATE repos only 2,000
    # free Actions minutes/month. At ~25-30s per run, 5-minute scheduling
    # is roughly 4,300-5,200 min/month — over the free allowance. PUBLIC
    # repos get UNLIMITED free Actions minutes. Check your usage anytime
    # at Settings > Billing > Plans and usage > Actions. If you go over
    # and don't want to make the repo public, change "*/5" back to "*/15"
    # or "*/10" below.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quant-bot-cycle
  cancel-in-progress: false

jobs:
  trading_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure state/data directories exist
        run: mkdir -p state data

      # Fast static-analysis pass (unused imports, undefined names, obvious
      # bugs). Deliberately just `ruff check`, not `black` — black only
      # reformats style with no bug-catching value, and would create noisy
      # diffs on a mobile-edited repo for no functional benefit. Also
      # non-blocking, for the same reason the test step is (see below).
      - name: Lint (ruff)
        continue-on-error: true
        run: |
          pip install ruff --quiet
          ruff check .

      # Runs the tests/ suite before touching real trading logic. Deliberately
      # non-blocking (continue-on-error): this bot is checked on periodically
      # from a phone, and a flaky/environmental test failure silently halting
      # the whole trading cycle for days would be worse than a visible warning
      # in the Actions log. Treat a red "Run tests" step as "go take a look",
      # not as "the bot is definitely broken".
      - name: Run tests
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python -m unittest discover -s tests -t . -v

      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          MIN_SIGNAL_PROBABILITY: ${{ vars.MIN_SIGNAL_PROBABILITY }}
          MIN_ADX: ${{ vars.MIN_ADX }}
          ATR_SL_MULTIPLIER: ${{ vars.ATR_SL_MULTIPLIER }}
          ATR_TP_MULTIPLIER: ${{ vars.ATR_TP_MULTIPLIER }}
          RISK_PERCENT_PER_TRADE: ${{ vars.RISK_PERCENT_PER_TRADE }}
          SL_WARNING_THRESHOLD: ${{ vars.SL_WARNING_THRESHOLD }}
          SYMBOL_COOLDOWN_CYCLES: ${{ vars.SYMBOL_COOLDOWN_CYCLES }}
          CYCLE_MINUTES: ${{ vars.CYCLE_MINUTES }}
          TRAILING_TRIGGER_R: ${{ vars.TRAILING_TRIGGER_R }}
        run: python main.py

      - name: Save state & history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: `git add fileA fileB fileC` fails ATOMICALLY — and
          # stages NOTHING AT ALL, not even files that DO exist with real
          # changes — if ANY single path in the list doesn't exist yet.
          # data/history.csv doesn't exist until the first trade closes,
          # and state/state.json.enc.bak doesn't exist until the second
          # save in a session that already had a primary file — so the old
          # single `git add a b c` call was silently discarding every
          # state save from day one whenever either of those was still
          # missing. Adding each path individually, only if it exists,
          # fixes this for good.
          for f in state/state.json.enc state/state.json.enc.bak data/history.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          echo "--- git status (for diagnostics in the Actions log) ---"
          git status --short

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update bot state & history [skip ci]"
            git push
            echo "✅ Pushed state changes."
          else
            echo "No state changes to commit."
          fi
