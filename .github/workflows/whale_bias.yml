name: Whale Bias - Hyperliquid Top Traders
on:
  workflow_dispatch:
  schedule:
    # Hourly: whale positioning doesn't need 5-minute freshness, and the
    # Hyperliquid leaderboard payload is tens of megabytes -- no reason to
    # pull it on the same 5-minute cadence as the trading cycle.
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: quant-bot-whale-bias
  cancel-in-progress: false
jobs:
  update_whale_bias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install requests
      - name: Refresh whale_bias.json from Hyperliquid
        run: python scripts/update_whale_bias.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- whale_bias.json; then
            git config user.name "quant-bot"
            git config user.email "actions@github.com"
            git add whale_bias.json
            git commit -m "chore: refresh whale_bias.json from Hyperliquid [skip ci]"
            git push
          else
            echo "No change to whale_bias.json this run."
          fi
