name: Quant Bot - Backtest Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Backtest
        run: |
          python scripts/run_backtest.py | tee /tmp/backtest.log
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('manual_settings.json').read_text())
          print('Backtest completed with manual_settings.json as the default configuration source.')
          print('Fibonacci hard gate:', cfg.get('gates',{}).get('fib_ote', False))
          PY
