name: Quant Bot - Backtest Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Backtest
        run: |
          python scripts/run_backtest.py | tee /tmp/backtest.log
          python - <<'PY'
          import pandas as pd
          p='BACKTEST_V30_RESULTS.csv'
          df=pd.read_csv(p)
          if not df.empty and not df['fib_ote'].fillna(False).all():
              raise SystemExit('Fibonacci hard-gate violation: a backtest trade is outside OTE')
          print(f'Fibonacci OTE gate verified for {len(df)} trades')
          PY
