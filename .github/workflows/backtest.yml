name: Quant Bot - Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols, e.g. BTCUSDT,ETHUSDT"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      days:
        description: "How many days of history to test"
        required: true
        default: "180"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download historical data
        run: |
          python scripts/fetch_historical_klines.py \
            --symbols "${{ inputs.symbols }}" \
            --days "${{ inputs.days }}"

      - name: Run backtest
        run: |
          python scripts/run_backtest.py \
            --symbols "${{ inputs.symbols }}" \
            --verbose

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_data/
          retention-days: 30
